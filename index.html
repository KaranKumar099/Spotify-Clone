<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utilities.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <nav class="flex-ai-center">
        <div class="first flex-ai-center">
            <img src="SVGs/logo.svg" alt="logo" class="invert">
            <span class="material-symbols-outlined invert">home</span>
            <div class="searchBar flex-ai-center">
                <span class="material-symbols-outlined invert">search</span>
            </div>
        </div>
        <div class="second flex-ai-center">
            <a href="#">Premium</a>
            <a href="#">Support</a>
            <a href="#">Download</a>
            <h1>|</h1>
            <a id="install flex-ai-center" href="#"><span class="material-symbols-outlined">download</span>Install App</a>
            <button id="signUp">Sign up</button>
            <button id="logIn">Log in</button>
        </div>
    </nav>
    <div class="main flex">
        <div class="left">
            <h3>Your Library</h3>
        </div>
        <div class="right">
            <h2>Trending Songs</h2>
            <div class="trendingSongs flex">
                <div class="card">
                    <img src="utilities/song1.png" alt="">
                    <h3 id="song">Courtside</h3>
                    <h3 id="artists">Karan Aujla, Signature by SB</h3>
                </div>
                <div class="card">
                    <img src="utilities/song1.png" alt="">
                    <h3 id="song">Courtside</h3>
                    <h3 id="artists">Karan Aujla, Signature by SB</h3>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
